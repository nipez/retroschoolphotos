# Cloudflare Pages project: retrophotosv1
# Static assets at repo root; API under functions/

name = "retrophotosv1"
compatibility_date = "2026-08-24"
pages_build_output_dir = "."

# Private R2 bucket for opted-in web-size yearbook JPEGs + index JSON.
# Images are served only via Pages Functions (/api/yearbook/:id), never a public r2.dev URL.
# Bucket: retro-yearbook (Public Access Disabled)
# Binding used in Functions: YEARBOOK
[[r2_buckets]]
binding = "YEARBOOK"
bucket_name = "retro-yearbook"
